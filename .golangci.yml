version: "2"
run:
  go: "1.23"
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      # Product copy and code comments are PT-BR; these are valid Portuguese words.
      ignore-rules:
        - corporativo
        - rela
        - circuitos
        - indicativo
        - operacional
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        path: cmd/verify/main.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gmowses/fepublica
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
