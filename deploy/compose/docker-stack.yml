x-worker-env: &worker-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-fepublica}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-fepublica}
  POSTGRES_SSLMODE: disable
  TRANSPARENCIA_API_KEY: ${TRANSPARENCIA_API_KEY:-}
  OTS_CALENDARS: ${OTS_CALENDARS:-https://alice.btc.calendar.opentimestamps.org,https://bob.btc.calendar.opentimestamps.org}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fepublica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fepublica}
    volumes:
      # The entrypoint reads this only when it initializes an empty volume.
      - type: bind
        source: ${FEPUBLICA_RELEASE_DIR:?FEPUBLICA_RELEASE_DIR is required}/db/migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        com.fepublica.component: postgres
      resources:
        limits: {memory: 512M}
        reservations: {memory: 128M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  anchor:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/anchor:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment:
      <<: *worker-env
      ANCHOR_BATCH_INTERVAL: ${ANCHOR_BATCH_INTERVAL:-6h}
    networks: [internal, egress]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  collector:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/collector:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    command: ["serve"]
    environment:
      <<: *worker-env
      # Without a key, only PNCP is scheduled; authenticated sources are gated in code.
      COLLECTOR_PNCP_SCHEDULE: ${COLLECTOR_PNCP_SCHEDULE:-30 4 * * *}
      COLLECTOR_CEIS_SCHEDULE: ${COLLECTOR_CEIS_SCHEDULE:-0 4 * * *}
      COLLECTOR_CNEP_SCHEDULE: ${COLLECTOR_CNEP_SCHEDULE:-15 4 * * *}
      COLLECTOR_CARTOES_SCHEDULE: ${COLLECTOR_CARTOES_SCHEDULE:-45 4 5 * *}
    networks: [internal, egress]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {memory: 128M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  contratos-indexer:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/contratos-indexer:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment: *worker-env
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  ceap-indexer:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/ceap-indexer:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment: *worker-env
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  cartoes-indexer:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/cartoes-indexer:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment: *worker-env
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  driftd:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/driftd:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment:
      <<: *worker-env
      DRIFT_INTERVAL: ${DRIFT_INTERVAL:-2m}
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  forenses-runner:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/forenses-runner:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment:
      <<: *worker-env
      FORENSES_INTERVAL: ${FORENSES_INTERVAL:-30m}
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

  api:
    image: ${FEPUBLICA_IMAGE_PREFIX:-fepublica}/api:${FEPUBLICA_IMAGE_VERSION:-1.6.0}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-fepublica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fepublica}
      # TLS is not needed on this private overlay; remote hosts are validated by config.
      POSTGRES_SSLMODE: disable
      TRANSPARENCIA_API_KEY: ${TRANSPARENCIA_API_KEY:-}
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      API_BASE_URL: https://${FEPUBLICA_DOMAIN:?FEPUBLICA_DOMAIN is required}
      METRICS_ADDR: 127.0.0.1:9090
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks: [internal, traefik-public]
    healthcheck:
      test: ["CMD", "/usr/local/bin/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.enable: "true"
        traefik.docker.network: traefik-public
        traefik.http.routers.fepublica.rule: Host(`${FEPUBLICA_DOMAIN:?FEPUBLICA_DOMAIN is required}`)
        traefik.http.routers.fepublica.entrypoints: websecure
        traefik.http.routers.fepublica.tls.certresolver: letsencrypt
        traefik.http.services.fepublica.loadbalancer.server.port: "8080"
        traefik.http.middlewares.fepublica-hsts.headers.stsSeconds: "31536000"
        traefik.http.middlewares.fepublica-hsts.headers.stsIncludeSubdomains: "true"
        traefik.http.middlewares.fepublica-security.headers.contentTypeNosniff: "true"
        traefik.http.middlewares.fepublica-security.headers.referrerPolicy: strict-origin-when-cross-origin
        traefik.http.middlewares.fepublica-security.headers.contentSecurityPolicy: "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com"
        traefik.http.middlewares.fepublica-ratelimit.ratelimit.average: "60"
        traefik.http.middlewares.fepublica-ratelimit.ratelimit.burst: "120"
        traefik.http.middlewares.fepublica-inflight.inFlightReq.amount: "100"
        traefik.http.routers.fepublica.middlewares: fepublica-hsts,fepublica-security,fepublica-ratelimit,fepublica-inflight
      resources:
        limits: {cpus: "1.0", memory: 256M}
        reservations: {memory: 64M}
      restart_policy: {condition: any}
      rollback_config: {parallelism: 1, order: stop-first}

volumes:
  postgres_data:
    name: fepublica_postgres_data

networks:
  internal:
    driver: overlay
    internal: true
  egress:
    driver: overlay
  traefik-public:
    external: true
    name: traefik-public
